[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-exec-notifier"
version = "0.2.0"
description = "Run Claude, Codex and Kiro from Telegram and get execution notifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["telegram", "notifications", "claude", "codex", "kiro", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Sette/telegram-exec-notifier"
Repository = "https://github.com/Sette/telegram-exec-notifier"
Issues = "https://github.com/Sette/telegram-exec-notifier/issues"

[project.scripts]
notify-telegram = "telegram_exec_notifier.cli:main"
telegram-exec-notifier = "telegram_exec_notifier.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pylint>=3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pylint.main]
init-hook = "import sys; sys.path.append('src')"
recursive = true

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 25
max-statements = 60
min-public-methods = 0

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring: module docstrings are kept where useful
    "C0116",  # missing-function-docstring: small private helpers do not need one
    "W0718",  # broad-exception-caught: the service must survive Telegram/CLI failures
]
