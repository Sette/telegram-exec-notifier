[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-exec-notifier"
version = "0.1.0"
description = "Send Claude and Codex execution notifications to Telegram"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
notify-telegram = "telegram_exec_notifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
